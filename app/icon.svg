<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="StreampediaTV">
  <!--
    Tab icon / favicon — the exact mark used in the site header
    (app/layout.tsx): a rounded square on the brand gradient with the inset
    1px white ring (`ring-1 ring-inset ring-[rgba(255,255,255,0.28)]`) and
    lucide-react's "play" glyph, at the same size ratio the header uses
    (22px icon inside a 42px box → 0.698 × the 24-unit lucide viewBox).

    The glyph is filled white instead of the header's stroked outline: at
    16px an outline is unreadable, and white-on-gradient is already this
    site's own treatment (see the filled <Play /> in VideoPlayer and the
    active SportNav tab).

    Both gradients are the brand gradient custom property from
    app/globals.css, one per theme: light #1a73e8 → #1967d2, dark
    #22d3ee → #3b82f6, switched with prefers-color-scheme so the tab icon
    follows the site theme.

    Next.js serves this file from the `icon` file convention and links it
    automatically — no `icons` entry in the metadata export is needed.
    (app/apple-icon.png carries the same mark full-bleed at 180x180 for
    iOS, which ignores SVG favicons and masks the corners itself.)
  -->
  <style>
    .box {
      fill: url(#gradLight);
    }
    @media (prefers-color-scheme: dark) {
      .box {
        fill: url(#gradDark);
      }
    }
  </style>
  <defs>
    <linearGradient id="gradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8" />
      <stop offset="1" stop-color="#1967d2" />
    </linearGradient>
    <linearGradient id="gradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Gradient tile. rx=8 of 32 matches the header's mobile radius
       (`max-[640px]:rounded-[10px]` on a 36px box). -->
  <rect class="box" width="32" height="32" rx="8" />

  <!-- Inset ring, i.e. the header's `ring-1 ring-inset`. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#fff" stroke-opacity="0.28" />

  <!-- lucide-react "play" (v1.55.0), centred like the header icon is. -->
  <g transform="translate(7.624 7.624) scale(0.698)" fill="#fff">
    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
  </g>
</svg>
